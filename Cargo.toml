[workspace]
resolver = "2"
members = [
  "navis-cli",
  "navis-core",
  "navis-pol",
  "navis-unpol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
# numerics
neopdf = { version = "0.3.3" }
pineappl = { version = "1.4.2" }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# internal crates
navis-core = { path = "./navis-core" }
navis-pol = { path = "./navis-pol" }
navis-unpol = { path = "./navis-unpol" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
